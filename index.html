<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>منصة النماذج الرقمية | ديوان قطاع الشباب والرياضة</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#0f4d33; --forest-dark:#0a331f; --forest-light:#166740;
    --gold:#c9971f; --gold-light:#e0b23c; --gold-dark:#9c760f;
    --navy:#0a331f; --navy-dark:#062318;
    --orange:#9c760f; --orange-dark:#7d5d0b;
    --cream:#faf8f2;
    --rail:76px; --panel:280px;
  }
  *{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;}
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html, body{ width:100%; max-width:100%; overflow-x:hidden; }
  body{background:var(--cream);color:#10321f;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#c9971f55;border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  .brand-grad{background:linear-gradient(135deg,var(--forest) 0%, var(--forest-dark) 100%);}
  .gold-grad{background:linear-gradient(135deg,var(--gold-light) 0%, var(--gold) 60%, var(--gold-dark) 100%);}
  .tone-navy{background:var(--navy);}
  .tone-green{background:var(--forest);}
  .tone-orange{background:var(--orange);}
  .field-input{border:1.5px solid #d8d2c2;border-radius:8px;padding:8px 12px;width:100%;font-size:14px;background:#fff;transition:.15s;}
  .field-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px #c9971f22;}
  .card-hover{transition:.2s;}
  .card-hover:hover{transform:translateY(-3px);box-shadow:0 12px 28px -8px rgba(15,77,51,.28);}
  .mentor-btn{width:22px;height:22px;border-radius:999px;background:#0f4d3312;color:var(--forest);display:inline-flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;border:1px solid #0f4d3330;flex-shrink:0;transition:.15s;}
  .mentor-btn:hover{background:var(--forest);color:#fff;transform:scale(1.08);}
  .zap-btn{width:22px;height:22px;border-radius:999px;background:#c9971f18;color:var(--gold-dark);display:inline-flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:1px solid #c9971f40;flex-shrink:0;transition:.15s;}
  .zap-btn:hover{background:var(--gold);color:#fff;transform:scale(1.08);}
  .zap-btn:disabled{opacity:.5;cursor:wait;}
  .drawer{transition:transform .35s cubic-bezier(.22,1,.36,1);}
  .fade-in{animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .spin{animation:spin 1s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .skeleton{background:linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

  /* ===== Sidebar: rail (collapsed, icons only) <-> panel (expanded) ===== */
  #sidebar{
    width:var(--rail);
    transition:width .28s cubic-bezier(.22,1,.36,1), transform .28s cubic-bezier(.22,1,.36,1);
  }
  #sidebar.expanded{ width:var(--panel); }
  @media (min-width:1024px){
    #sidebar{ position:sticky; top:0; height:100vh; transform:none !important; }
    #sidebar:hover{ width:var(--panel); }
    #sidebar:hover .sb-text{ opacity:1; }
    #sidebar .sb-text{ opacity:0; transition:opacity .18s ease .05s; white-space:nowrap; }
    #sidebar:hover .sb-text{ transition-delay:.08s; }
  }
  @media (max-width:1023px){
    #sidebar{
      position:fixed !important; top:0; right:0; left:auto; bottom:0;
      height:100vh; height:100dvh;
      width:85vw; max-width:300px; min-width:260px;
      z-index:50;
      transform:translateX(100%);
      transition:transform .28s cubic-bezier(.22,1,.36,1);
      box-shadow:-8px 0 30px -8px rgba(0,0,0,.35);
    }
    #sidebar.mobile-open{ transform:translateX(0); }
    #sidebar .sb-text{ opacity:1; }
  }
  #sbBackdrop{ position:fixed; inset:0; }
  .sb-scrollarea{ scrollbar-width:thin; }

  .diwan-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px;padding-top:14px;border-top:3px solid var(--gold);break-inside:avoid;page-break-inside:avoid;}
  .diwan-footer .df-brand{display:flex;align-items:center;gap:10px;}
  .diwan-footer .df-brand img{width:48px;height:48px;}
  .diwan-footer .df-name{font-weight:800;font-size:13px;color:var(--forest-dark);}
  .diwan-footer .df-link{font-size:11px;color:var(--forest);direction:ltr;unicode-bidi:embed;display:block;text-decoration:none;}
  .diwan-footer .df-sig{text-align:center;} .diwan-footer .df-sig img{height:46px;width:auto;display:block;margin:0 auto;}
  .diwan-footer .df-cap{font-size:10px;color:#6b7a70;margin-top:2px;}
  .diwan-footer .df-qr{text-align:center;} .diwan-footer .df-qr img{width:88px;height:88px;display:block;margin:0 auto;}
  @media print{
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;inset:0;width:100%;}
    .no-print{display:none!important;}
  }
</style>
</head>

<div id="offlineBanner" class="hidden fixed top-0 inset-x-0 z-[70] bg-amber-600 text-white text-[12px] sm:text-[12.5px] font-bold text-center py-2 px-3 no-print">
  🔌 أنت غير متصل بالإنترنت — الحفظ والأرشيف والتصدير تعمل بشكل طبيعي، والمساعد الذكي والتوليد يعملان دون إنترنت أيضاً.
</div>

<div id="app" class="flex min-h-screen"></div>

<div id="mentorBackdrop" class="fixed inset-0 bg-black/40 z-40 hidden no-print" onclick="closeMentor()"></div>
<aside id="mentorDrawer" class="drawer fixed top-0 right-0 h-full w-full sm:w-[420px] bg-white z-50 shadow-2xl no-print" style="transform:translateX(100%)">
  <div class="brand-grad text-white p-5 flex items-start justify-between gap-3">
    <div>
      <div class="flex items-center gap-2 text-amber-300 text-xs font-bold mb-1"><span>✦</span><span>المرافق الذكي</span></div>
      <h3 id="mentorTitle" class="text-lg font-extrabold leading-snug"></h3>
    </div>
    <button onclick="closeMentor()" class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center text-xl leading-none flex-shrink-0">×</button>
  </div>
  <div id="mentorBody" class="p-5 overflow-y-auto" style="height:calc(100% - 88px)"></div>
</aside>

QRCodeModel.createData = function(typeNumber, level, dataList){
  var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, level);
  var buffer = new QRBitBuffer();
  var lenBits = typeNumber<=9 ? 8 : 16;
  for(var i=0;i<dataList.length;i++){
    var data = dataList[i];
    buffer.put(QRMode.MODE_8BIT_BYTE, 4);
    buffer.put(data.getLength(), lenBits);
    data.write(buffer);
  }
  var totalDataCount=0;
  for(var i=0;i<rsBlocks.length;i++) totalDataCount += rsBlocks[i].dataCount;
  if(buffer.getLengthInBits() > totalDataCount*8) throw new Error('overflow');
  if(buffer.getLengthInBits()+4 <= totalDataCount*8) buffer.put(0,4);
  while(buffer.getLengthInBits()%8!==0) buffer.putBit(false);
  while(true){
    if(buffer.getLengthInBits()>=totalDataCount*8) break;
    buffer.put(QRCodeModel.PAD0,8);
    if(buffer.getLengthInBits()>=totalDataCount*8) break;
    buffer.put(QRCodeModel.PAD1,8);
  }

};
QRCodeModel.createBytes = function(buffer, rsBlocks){
  var offset=0, maxDc=0, maxEc=0;
  var dcdata=new Array(rsBlocks.length), ecdata=new Array(rsBlocks.length);
  for(var r=0;r<rsBlocks.length;r++){
    var dcCount=rsBlocks[r].dataCount, ecCount=rsBlocks[r].totalCount-dcCount;
    maxDc=Math.max(maxDc,dcCount); maxEc=Math.max(maxEc,ecCount);
    dcdata[r]=new Array(dcCount);
    for(var i=0;i<dcdata[r].length;i++) dcdata[r][i]=0xFF & buffer.buffer[i+offset];
    offset += dcCount;
    var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
    var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength()-1);
    var modPoly = rawPoly.mod(rsPoly);
    ecdata[r] = new Array(rsPoly.getLength()-1);
    for(var i=0;i<ecdata[r].length;i++){
      var mi = i + modPoly.getLength() - ecdata[r].length;
      ecdata[r][i] = (mi>=0) ? modPoly.get(mi) : 0;
    }
  }
  var totalCount=0;
  for(var i=0;i<rsBlocks.length;i++) totalCount += rsBlocks[i].totalCount;
  var data = new Array(totalCount), index=0;
  for(var i=0;i<maxDc;i++) for(var r=0;r<rsBlocks.length;r++) if(i<dcdata[r].length) data[index++]=dcdata[r][i];

};
function qrByteCapacity(typeNumber, level){
  var key = {1:'L',0:'M',3:'Q',2:'H'}[level];
  var groups = RS_BLOCK_TABLE_V1_10[typeNumber][key], total=0;
  groups.forEach(function(g){ total += g[0]*g[2]; });
  var lenBits = typeNumber<=9?8:16;
  return Math.floor((total*8 - (4+lenBits))/8);
}
function generateQRModel(text, preferLevel){
  var level = QRErrorCorrectLevel[preferLevel||'L'];
  var byteLen = unescape(encodeURIComponent(text)).length;
  var maxCap = qrByteCapacity(10, level);
  if(byteLen > maxCap){
    while(unescape(encodeURIComponent(text)).length > maxCap && text.length>0) text = text.slice(0,-1);
  }
  var type = 10;
  for(var t=1;t<=10;t++){ if(qrByteCapacity(t, level) >= unescape(encodeURIComponent(text)).length){ type=t; break; } }
  var qr = new QRCodeModel(type, level);
  qr.addData(text);
  qr.make();
  return qr;
}
function renderQRDataUrl(text, pxSize){
  try{
    const qr = generateQRModel(text, 'L');
    const n = qr.getModuleCount();
    const margin = 3;
    const scale = Math.max(1, Math.floor(pxSize / (n + margin*2)));
    const size = (n + margin*2) * scale;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0,0,size,size);
    ctx.fillStyle = '#10321f';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++){
      if(qr.isDark(r,c)) ctx.fillRect((c+margin)*scale, (r+margin)*scale, scale, scale);
    }
    return {dataUrl: canvas.toDataURL('image/png'), size};
  }catch(e){ return null; }
}

function getArchive(){ try{ return JSON.parse(localStorage.getItem('jeunesse_archive')||'[]'); }catch(e){ return []; } }
function setArchive(arr){ try{ localStorage.setItem('jeunesse_archive', JSON.stringify(arr)); }catch(e){} }

function collectFormData(formId){
  const s = FORMS[formId]; const values={}, checks={}, tables={};
  s.sections.forEach(sec=>{
    if(sec.type==="table"){
      const hasIndex = sec.indexCol !== false; const dataCols = hasIndex ? sec.cols.slice(1) : sec.cols;
      const rows = [];
      for(let r=0;r<sec.rows;r++){
        rows.push(dataCols.map((c,ci)=>{
          const el = document.querySelector(`input[data-table="s${sec.n}"][data-row="${r}"][data-col="${ci}"]`);
          return (el && !el.readOnly) ? el.value : "";
        }));
      }
      tables[`s${sec.n}`] = rows;
    } else if(sec.type==="approval"){
      const rows = sec.cols.map((c,ci)=>[0,1,2,3].map(fi=>document.querySelector(`input[data-table="s${sec.n}"][data-row="${ci}"][data-col="${fi}"]`)?.value || ""));
      tables[`s${sec.n}`] = rows;
    } else {
      sec.fields.forEach((f,idx)=>{
        const id = `s${sec.n}_f${idx}`;
        if(f.type==="checks") checks[id] = Array.from(document.querySelectorAll(`input[data-id="${id}"]:checked`)).map(x=>x.dataset.opt);
        else values[id] = fid(id)?.value || "";
      });
    }
  });
  return {values, checks, tables};
}

function persistCurrentForm(formId){
  const data = collectFormData(formId);
  if(STATE.editingArchiveId){
    let arr = getArchive(); const idx = arr.findIndex(e=>e.id===STATE.editingArchiveId);
    if(idx>-1){ arr[idx].data = data; arr[idx].savedAt = Date.now(); setArchive(arr); }
  } else {
    try{ localStorage.setItem('draft_'+formId, JSON.stringify(data)); }catch(e){}
  }
  updateSavedIndicator();
  updateProgressBar(formId);
}

function attachAutoSave(formId){
  const area = fid("printArea"); if(!area) return;
  const handler = ()=>{ clearTimeout(autoSaveTimer); autoSaveTimer = setTimeout(()=>persistCurrentForm(formId), 700); };
  area.addEventListener("input", handler);
  area.addEventListener("change", handler);
}

function updateSavedIndicator(){
  const el = fid("savedIndicator"); if(!el) return;
  const now = new Date(); const hh = String(now.getHours()).padStart(2,"0"), mm = String(now.getMinutes()).padStart(2,"0");
  el.textContent = `💾 آخر حفظ ${hh}:${mm}`; el.classList.remove("opacity-0");
}

function saveToArchive(formId){
  const data = collectFormData(formId);
  let arr = getArchive();
  if(STATE.editingArchiveId){
    const idx = arr.findIndex(e=>e.id===STATE.editingArchiveId);
    if(idx>-1){ arr[idx].data=data; arr[idx].savedAt=Date.now(); setArchive(arr); toast("تم تحديث الوثيقة المحفوظة 💾"); updateSavedIndicator(); return; }
  }
  const id = "a_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
  arr.unshift({id, formId, title:FORMS[formId].title, savedAt:Date.now(), data});
  setArchive(arr);
  STATE.editingArchiveId = id;
  try{ localStorage.removeItem("draft_"+formId); }catch(e){}
  toast("تم حفظ الوثيقة في الأرشيف 💾");
  renderApp(); afterFormRender(formId);
}

/* ===================================================================== التحقق ونسبة الاكتمال ===================================================================== */
function computeCompletion(formId){
  const s = FORMS[formId]; if(!s) return {filled:0,total:0,pct:0};
  let total=0, filled=0;
  s.sections.forEach(sec=>{
    if(sec.type==="table"||sec.type==="approval") return;
    sec.fields.forEach((f,idx)=>{
      total++;
      const id = `s${sec.n}_f${idx}`;
      if(f.type==="checks"){ if(document.querySelectorAll(`input[data-id="${id}"]:checked`).length) filled++; }
      else { if(fid(id) && fid(id).value.trim()) filled++; }
    });
  });
  return {filled, total, pct: total ? Math.round(filled/total*100) : 0};
}
function updateProgressBar(formId){
  const {pct} = computeCompletion(formId);
  const bar = fid("progressBarFill"), txt = fid("progressBarText");
  if(bar){ bar.style.width = pct+"%"; bar.style.background = pct<40?"#b23b3b":pct<80?"#c9971f":"#0f4d33"; }
  if(txt){ txt.textContent = pct+"% مكتمل"; }
}

function attachDateValidation(formId){
  const s = FORMS[formId]; if(!s) return;
  s.sections.forEach(sec=>{
    if(sec.type==="table"||sec.type==="approval") return;
    const dateFields = sec.fields.map((f,idx)=>({f,idx})).filter(x=>x.f.type==="date");
    for(let i=0;i<dateFields.length-1;i++){
      const a=dateFields[i], b=dateFields[i+1];
      if(/من|بداية|انطلاق/.test(a.f.label) && /إلى|نهاية/.test(b.f.label)){
        const idA=`s${sec.n}_f${a.idx}`, idB=`s${sec.n}_f${b.idx}`;
        const elA=fid(idA), elB=fid(idB); if(!elA||!elB) continue;
        const check=()=>{
          let warn = fid("warn_"+idB);
          if(elA.value && elB.value && elA.value > elB.value){
            if(!warn){ warn=document.createElement("div"); warn.id="warn_"+idB; warn.className="text-[11px] text-red-600 font-bold mt-1"; elB.insertAdjacentElement("afterend", warn); }
            warn.textContent = "⚠️ يجب أن يكون هذا التاريخ بعد تاريخ البداية";
          } else if(warn){ warn.remove(); }
        };
        elA.addEventListener("change", check); elB.addEventListener("change", check);
      }
    }
  });
}

function afterFormRender(formId, skipDraftLoad){
  if(!FORMS[formId]) return;
  if(!skipDraftLoad && !STATE.editingArchiveId){
    const draftRaw = localStorage.getItem("draft_"+formId);
    if(draftRaw){ try{ applyDocumentValues(JSON.parse(draftRaw)); }catch(e){} }
  }
  attachAutoSave(formId);
  attachDateValidation(formId);
  updateProgressBar(formId);
  updateSavedIndicator();
}

function renderTableSection(sec){
  const hasIndex = sec.indexCol !== false;
  const dataCols = hasIndex ? sec.cols.slice(1) : sec.cols;
  const rows = Array.from({length:sec.rows}).map((_,ri)=>{
    const preset = sec.presets ? sec.presets[ri] : null;
    const idxCell = hasIndex ? `<td class="border border-gray-200 text-center text-[12px] font-bold text-gray-500 w-10">${ri+1}</td>` : "";
    const cells = dataCols.map((c,ci)=>{
      const presetVal = preset ? preset[ci] : null;
      if(presetVal){
        return `<td class="border border-gray-200 p-0"><input data-table="s${sec.n}" data-row="${ri}" data-col="${ci}" value="${presetVal}" readonly class="w-full h-full px-2 py-1.5 text-[12.5px] bg-gray-50 font-bold text-[var(--forest-dark)] outline-none"/></td>`;
      }
      return `<td class="border border-gray-200 p-0"><input data-table="s${sec.n}" data-row="${ri}" data-col="${ci}" class="w-full h-full px-2 py-1.5 text-[12.5px] outline-none"/></td>`;
    }).join("");
    return `<tr>${idxCell}${cells}</tr>`;
  }).join("");
  return `<div class="bg-white rounded-xl border border-black/5 p-4 mb-5">
    ${sectionHeader(sec)}
    <div class="overflow-x-auto"><table class="w-full border-collapse text-[12.5px]">

}

/* ===================================================================== AI CORE: طلب JSON قوي مع استخراج احتياطي ===================================================================== */
/* ===================================================================== مولّد احتياطي محلي (يعمل بدون اتصال) ===================================================================== */
const NAME_POOL = ["أمين بلقاسم","ياسمين حمدي","سارة بن عمر","إلياس معمري","نور الهدى شريف","عبد الرحمن زروقي","خديجة بوزيد","محمد أمين قاسمي"];
const PLACE_POOL = ["دار الشباب - وسط المدينة","المركب الرياضي الجواري","قاعة المحاضرات - ديوان الشباب","الفضاء الشبابي متعدد الأنشطة"];
const TOPIC_POOL = ["نشاط توعوي حول الذكاء الاصطناعي والاستخدام الآمن للتكنولوجيا","ورشة حول المواطنة الرقمية وأخلاقيات الإنترنت","مخيم قيادة شبابية وتنمية المهارات الحياتية","حملة تحسيسية حول حماية البيئة والتنمية المستدامة"];
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function todayPlus(days){ const d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }

function fallbackFieldValue(label, type, options){
  const l = label;
  if(type==="checks") return options.slice(0, Math.min(2,options.length));
  if(type==="date") return todayPlus(Math.floor(Math.random()*20));
  if(/اسم.*مؤسس|مؤسسة/.test(l)) return "دار الشباب — بلدية الجزائر الوسطى";
  if(/الولاية/.test(l)) return "الجزائر";
  if(/البلدية/.test(l)) return "الجزائر الوسطى";
  if(/اسم.*لقب|^الاسم$|الاسم :/.test(l)) return pick(NAME_POOL);
  if(/مكان|عنوان(?!.*مبادرة)/.test(l)) return pick(PLACE_POOL);
  if(/هاتف/.test(l)) return "0555 12 34 56";
  if(/بريد/.test(l)) return "contact@jeunesse.dz";
  if(/^(عدد|نسبة)|%|درجة الأهمية|درجة التحكم/.test(l)) return String(20+Math.floor(Math.random()*80));
  if(/اسم النشاط|اسم المشروع|اسم المبادرة|اسم البرنامج|عنوان النشاط/.test(l)) return pick(TOPIC_POOL);
  if(/^مدة/.test(l)) return "3 أيام";
  if(/المسؤول|المسؤولون|المنسق|المشرف/.test(l)) return pick(NAME_POOL);
  if(/الحالة/.test(l)) return pick(["قيد التنفيذ","منجز","متابعة مستمرة"]);
  if(/مجال الاحتياج|مجالات الاحتياج|مجال (المبادرة|النشاط)/.test(l)) return pick(["تربوية وتعليمية","رياضية وترفيهية","ثقافية وفنية"]);
  if(/وصف الحاجة|وصف المرحلة|وصف/.test(l)) return `حاجة فعلية مرتبطة بـ${pick(TOPIC_POOL)} لدى الفئة المستهدفة`;
  if(/الأسباب|السبب/.test(l)) return "نقص في التحسيس والموارد المخصصة لهذا المجال";
  if(/الحلول|الحل المقترح/.test(l)) return "تكثيف الأنشطة التحسيسية وتوفير موارد إضافية بالتنسيق مع الشركاء";
  if(/النتيجة|النتائج|المحقق/.test(l)) return "تحقيق مستهدف بنسبة مقبولة مع إمكانية التحسين";
  if(/المؤشر/.test(l)) return "نسبة إنجاز الأنشطة المبرمجة";
  if(/الإجراء|التوصية|التوصيات/.test(l)) return "متابعة دورية وتقييم مرحلي مع تعديل الخطة عند الحاجة";
  if(/ملاحظات|ملاحظة/.test(l)) return "لا ملاحظات إضافية في هذه المرحلة";
  if(/الأولوية/.test(l)) return pick(["مرتفعة","متوسطة"]);
  if(type==="textarea") return `عناصر أساسية متعلقة بـ${l} تمت صياغتها بشكل واقعي ومهني ضمن سياق ${pick(TOPIC_POOL)}.`;
  return pick(TOPIC_POOL);
}

/* ===================================================================== AI MENTOR ===================================================================== */
async function openMentor(fieldLabel, formTitle){
  fid("mentorTitle").textContent = fieldLabel;
  fid("mentorDrawer").style.transform = "translateX(0)";
  fid("mentorBackdrop").classList.remove("hidden");
  const body = fid("mentorBody");
  body.innerHTML = `<div class="space-y-4"><div class="skeleton h-4 w-1/3 rounded"></div><div class="skeleton h-16 w-full rounded"></div><div class="skeleton h-4 w-1/4 rounded"></div><div class="skeleton h-16 w-full rounded"></div></div>`;
  body.innerHTML = mentorTemplate(localMentor(fieldLabel, formTitle));
}
function localMentor(label, formTitle){
  const l = label;
  const rules = [

  ];
  let r = rules.find(x=>x[0].test(l));
  const what = r ? r[1] : "صف بدقة ما يتعلق بـ«"+l+"» في سياق «"+formTitle+"» بمعلومات واقعية ومحددة.";

}

/* ===================================================================== AI FILL: حقل واحد فقط ===================================================================== */
async function fillSingleField(formId, sectionN, fieldIdx){
  const s = FORMS[formId];
  const sec = s.sections.find(x=>x.n===sectionN);
  const f = sec.fields[fieldIdx];
  const fieldId = `s${sectionN}_f${fieldIdx}`;
  const btn = document.querySelector(`[data-zap="${fieldId}"]`);
  const original = btn.innerHTML; btn.innerHTML = `<span class="spin">⏳</span>`; btn.disabled = true;

  try{
    if(f.type==="checks"){
      const opts = fallbackFieldValue(f.label,"checks",f.options);
      document.querySelectorAll(`input[data-id="${fieldId}"]`).forEach(cb=>{ cb.checked = opts.includes(cb.dataset.opt); });
    } else {
      fid(fieldId).value = fallbackFieldValue(f.label, f.type, []);
    }
    toast("تم توليد الحقل ✨");
  }finally{
    btn.innerHTML = original; btn.disabled = false;
  }
}

/* ===================================================================== AI FILL: الوثيقة كاملة (مع نسخة احتياطية محلية) ===================================================================== */
async function autoFillDocument(formId){
  const s = FORMS[formId];
  const btn = fid("autofillBtn"); const original = btn.innerHTML;
  btn.innerHTML = `<span class="spin">⏳</span> جارِ التوليد...`; btn.disabled = true;

  const plainFields = []; const checkFields = []; const tableSections = [];
  s.sections.forEach(sec=>{
    if(sec.type==="table"){ tableSections.push(sec); return; }
    if(sec.type==="approval") return;
    sec.fields.forEach((f,idx)=>{
      const id = `s${sec.n}_f${idx}`;
      if(f.type==="checks") checkFields.push({id,label:f.label,options:f.options});
      else plainFields.push({id,label:f.label,type:f.type});
    });
  });

  let usedFallback = false;
  {















    
    const topic = pick(TOPIC_POOL);
    const values = {}; plainFields.forEach(f=>{ values[f.id] = fallbackFieldValue(f.label, f.type, []); });
    const checks = {}; checkFields.forEach(f=>{ checks[f.id] = fallbackFieldValue(f.label,"checks",f.options); });
    const tables = {}; tableSections.forEach(t=>{
      const hasIndex = t.indexCol!==false; const cols = hasIndex? t.cols.slice(1) : t.cols;
      const nRows = Math.min(t.rows,4);
      tables[`s${t.n}`] = Array.from({length:nRows}).map(()=> cols.map(c=> fallbackFieldValue(c,"text",[])) );
    });
    applyDocumentValues({values,checks,tables}, plainFields, checkFields, tableSections);
  }
  {
    btn.innerHTML = original; btn.disabled = false;
    toast("تم توليد بيانات واقعية وملء الوثيقة بنجاح ✨");
  }
}

function applyDocumentValues(parsed, plainFields, checkFields, tableSections){
  Object.entries(parsed.values||{}).forEach(([id,val])=>{ const el=fid(id); if(el) el.value = val; });
  Object.entries(parsed.checks||{}).forEach(([id,opts])=>{
    document.querySelectorAll(`input[data-id="${id}"]`).forEach(cb=>{ cb.checked = (opts||[]).includes(cb.dataset.opt); });
  });
  Object.entries(parsed.tables||{}).forEach(([tid,rows])=>{
    (rows||[]).forEach((row,ri)=>{
      row.forEach((val,ci)=>{
        const el = document.querySelector(`input[data-table="${tid}"][data-row="${ri}"][data-col="${ci}"]`);
        if(el && !el.readOnly) el.value = val;
      });
    });
  });
}

/* ===================================================================== EXPORT: PDF + Word ===================================================================== */
async function exportPDF(formId){
  const {pct} = computeCompletion(formId);
  if(pct < 40 && !confirm(`الوثيقة مكتملة بنسبة ${pct}% فقط. هل تريد المتابعة بالتصدير رغم ذلك؟`)) return;
  const btn = fid("pdfBtn"); const original = btn.innerHTML; btn.innerHTML = "⏳ جارِ التجهيز...";
  try{
    const area = fid("printArea");
    const canvas = await html2canvas(area, {scale:2, backgroundColor:"#ffffff"});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p","mm","a4");
    const pageW=210, pageH=297, imgW=pageW, imgH = canvas.height*imgW/canvas.width;
    let heightLeft = imgH, position = 0;
    const imgData = canvas.toDataURL("image/jpeg",0.95);
    pdf.addImage(imgData,"JPEG",0,position,imgW,imgH); heightLeft -= pageH;
    while(heightLeft > 0){ position = heightLeft - imgH; pdf.addPage(); pdf.addImage(imgData,"JPEG",0,position,imgW,imgH); heightLeft -= pageH; }
    pdf.save(`نموذج_${formId}_${FORMS[formId].title}.pdf`);
    toast("تم تصدير الملف بصيغة PDF بنجاح 📄");
  }catch(e){ toast("حدث خطأ أثناء تصدير PDF", true); }
  finally{ btn.innerHTML = original; }
}

async function exportWord(formId){
  const {pct} = computeCompletion(formId);
  if(pct < 40 && !confirm(`الوثيقة مكتملة بنسبة ${pct}% فقط. هل تريد المتابعة بالتصدير رغم ذلك؟`)) return;
  try{
    const { Document, Packer, Paragraph, TextRun, AlignmentType } = docx;
    const s = FORMS[formId];
    const children = [
      new Paragraph({ alignment:AlignmentType.CENTER, bidirectional:true, children:[ new TextRun({text:`نموذج ${formId}: ${s.title}`, bold:true, size:36, rightToLeft:true})] }),
      new Paragraph({ alignment:AlignmentType.CENTER, bidirectional:true, children:[ new TextRun({text:s.desc, italics:true, size:22, color:"555555", rightToLeft:true})], spacing:{after:300} }),
    ];
    s.sections.forEach(sec=>{
      children.push(new Paragraph({ bidirectional:true, spacing:{before:250, after:120},
        children:[ new TextRun({text:`${sec.n}. ${sec.title}`, bold:true, size:26, color:"0F4D33", rightToLeft:true})]}));
      if(sec.type==="table"){
        const hasIndex = sec.indexCol !== false;
        const dataCols = hasIndex ? sec.cols.slice(1) : sec.cols;
        for(let r=0;r<sec.rows;r++){
          const vals = dataCols.map((c,ci)=>document.querySelector(`input[data-table="s${sec.n}"][data-row="${r}"][data-col="${ci}"]`)?.value || "");
          if(vals.every(v=>!v)) continue;
          children.push(new Paragraph({ bidirectional:true, children:[ new TextRun({text:`${r+1}) ${dataCols.map((c,i)=>`${c}: ${vals[i]||"—"}`).join(" | ")}`, size:20, rightToLeft:true})]}));
        }
      } else if(sec.type==="approval"){
        sec.cols.forEach((c,ci)=>{
          const name = document.querySelector(`input[data-table="s${sec.n}"][data-row="${ci}"][data-col="0"]`)?.value || "—";
          const role = document.querySelector(`input[data-table="s${sec.n}"][data-row="${ci}"][data-col="1"]`)?.value || "—";
          children.push(new Paragraph({ bidirectional:true, children:[ new TextRun({text:`${c} — الاسم: ${name} | الصفة: ${role}`, size:20, rightToLeft:true})]}));
        });
      } else {
        sec.fields.forEach((f,idx)=>{
          const id = `s${sec.n}_f${idx}`; let val = "—";
          if(f.type==="checks"){
            const checked = Array.from(document.querySelectorAll(`input[data-id="${id}"]:checked`)).map(x=>x.dataset.opt);
            val = checked.length? checked.join("، ") : "—";
          } else { val = fid(id)?.value || "—"; }
          children.push(new Paragraph({ bidirectional:true, spacing:{after:80},
            children:[ new TextRun({text:`${f.label}: `, bold:true, size:21, rightToLeft:true}), new TextRun({text:val, size:21, rightToLeft:true})]}));
        });
      }
    });
    children.push(...diwanDocxFooter(docx,'ar'));
    const doc = new Document({ sections:[{ properties:{}, children }] });
    const blob = await Packer.toBlob(doc);
    saveAs(blob, `نموذج_${formId}_${s.title}.docx`);
    toast("تم تصدير الملف بصيغة Word بنجاح 📝");
  }catch(e){ toast("حدث خطأ أثناء تصدير Word", true); }
}

function builderSave(){
  const title = fid("bTitle").value.trim();
  if(!title){ toast("يرجى إدخال عنوان النموذج", true); return; }
  const desc = fid("bDesc").value.trim() || "نموذج مخصص";
  const icon = fid("bIcon").value.trim() || "📄";
  const sectionEls = Array.from(fid("builderSectionsList").children);
  if(!sectionEls.length){ toast("أضف قسماً واحداً على الأقل", true); return; }
  const sections = [];
  sectionEls.forEach((div,i)=>{
    const secTitle = div.querySelector(".b-sec-title").value.trim() || `قسم ${i+1}`;
    const tone = div.querySelector(".b-sec-tone").value;
    const type = div.querySelector(".b-sec-type").value;
    const n = i+1;
    if(type==="fields"){
      const rows = Array.from(div.querySelectorAll(".b-field-row"));
      const fields = rows.map(row=>{
        const label = row.querySelector(".b-field-label").value.trim() || "حقل";
        const ftype = row.querySelector(".b-field-type").value;
        const obj = {label, type:ftype};
        if(ftype==="checks"){
          const opts = row.querySelector(".b-field-options").value.split(/[،,]/).map(x=>x.trim()).filter(Boolean);
          obj.options = opts.length ? opts : ["نعم","لا"];
        }
        return obj;
      });
      if(fields.length) sections.push({n, tone, title:secTitle, icon:"📌", fields});

function readDoc(formId){

      const dataCols = hasIndex ? sec.cols.slice(1) : sec.cols;
      const rows = [];
      for(let r=0;r<sec.rows;r++){

          return el ? el.value.trim() : "";
        });
        rows.push(hasIndex ? [String(r+1), ...vals] : vals);
      }
      return {n:sec.n, title:sec.title, kind:"table", cols:sec.cols, rows};
    }
    if(sec.type==="approval"){
      const labels = ["الاسم","الصفة","التاريخ","التوقيع"];
      const rows = labels.map((l,fi)=>[l, ...sec.cols.map((c,ci)=>{
        const el = document.querySelector(`input[data-table="s${sec.n}"][data-row="${ci}"][data-col="${fi}"]`);
        return el ? el.value.trim() : "";
      })]);
      return {n:sec.n, title:sec.title, kind:"approval", cols:["", ...sec.cols], rows};
    }
    const items = sec.fields.map((f,idx)=>{
      const id = `s${sec.n}_f${idx}`;
      if(f.type==="checks"){
        const sel = Array.from(document.querySelectorAll(`input[data-id="${id}"]:checked`)).map(x=>x.dataset.opt);

      }

      return {label:f.label, value: el ? el.value.trim() : ""};
    });

  });

}

const CRC_T = (function(){ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? (0xEDB88320^(c>>>1)) : (c>>>1); t[n]=c>>>0; } return t; })();

  const dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  files.forEach(f=>{
    const nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,dt,true); lh.setUint16(12,dd,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,sz,true); lh.setUint32(22,sz,true); lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), nm, f.data);

    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,dt,true); ch.setUint16(14,dd,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,sz,true); ch.setUint32(24,sz,true); ch.setUint16(28,nm.length,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), nm);
    offset += 30+nm.length+sz;

  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cd,true); end.setUint32(16,offset,true);

  const documentXml = `${XMLH}<w:document ${NS_ALL}><w:body>${b}</w:body></w:document>`;
  const fld=(ins)=>`<w:fldSimple w:instr=" ${ins} "><w:r>${rpr({sz:18,color:"777777"})}<w:t>1</w:t></w:r></w:fldSimple>`;
  const footerXml = `${XMLH}<w:ftr ${NS_ALL}><w:p><w:pPr><w:bidi/><w:jc w:val="center"/></w:pPr>${run("الصفحة ",{sz:18,color:"777777"})}${fld("PAGE")}${run(" / ",{sz:18,color:"777777"})}${fld("NUMPAGES")}</w:p></w:ftr>`;
  const stylesXml = `${XMLH}<w:styles ${NS_W}><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="ar-DZ" w:bidi="ar-DZ"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:bidi/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>${[1,2,3].map(n=>`<w:style w:type="paragraph" w:styleId="Heading${n}"><w:name w:val="heading ${n}"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:outlineLvl w:val="${n-1}"/></w:pPr></w:style>`).join("")}</w:styles>`;
  const docRels = `${XMLH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdFooter" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>${images.map((m,i)=>`<Relationship Id="rIdImg${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name}"/>`).join("")}</Relationships>`;
  const rels = `${XMLH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const ct = `${XMLH}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`;
  const files=[
    {name:"[Content_Types].xml",data:enc.encode(ct)},
    {name:"_rels/.rels",data:enc.encode(rels)},
    {name:"word/document.xml",data:enc.encode(documentXml)},
    {name:"word/styles.xml",data:enc.encode(stylesXml)},
    {name:"word/footer1.xml",data:enc.encode(footerXml)},
    {name:"word/_rels/document.xml.rels",data:enc.encode(docRels)},
    ...images.map(m=>({name:"word/media/"+m.name,data:m.data}))
  ];
  return zipStore(files, FORMATS.docx.mime);
}

async function buildDocxSafe(formId, docName){
  return buildDocxLite(formId, docName);
}

/* تنزيل مستقل لا يعتمد على FileSaver */
function downloadBlob(blob, name){
  if(typeof saveAs==="function"){ try{ saveAs(blob,name); return; }catch(e){} }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000);
}

/* ================= PDF ================= */
async function buildPdfBlob(){
  const area = fid("printArea");
  const canvas = await html2canvas(area,{scale:2,backgroundColor:"#ffffff"});
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF("p","mm","a4");
  const pageW=210, pageH=297, imgW=pageW, imgH=canvas.height*imgW/canvas.width;
  let heightLeft=imgH, position=0;
  const img = canvas.toDataURL("image/jpeg",0.95);
  pdf.addImage(img,"JPEG",0,position,imgW,imgH); heightLeft-=pageH;
  while(heightLeft>0){ position=heightLeft-imgH; pdf.addPage(); pdf.addImage(img,"JPEG",0,position,imgW,imgH); heightLeft-=pageH; }
  return pdf.output("blob");
}

/* ================= HTML ================= */
function buildHtmlBlob(formId, docName){
  const M = readDoc(formId);
  const title = (docName||"").trim() || `نموذج ${formId}: ${M.title}`;
  const tbl = sec=>`<table><thead><tr>${sec.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${
    sec.rows.map(r=>`<tr>${r.map((v,i)=>`<td${sec.kind==="approval"&&i===0?' class="lbl"':''}>${esc(v).replace(/\n/g,"<br>")||"&nbsp;"}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  const secs = M.sections.map(sec=>{
    let inner;
    if(sec.kind==="fields") inner = sec.items.map(it=>`<h3>${esc(it.label)}</h3>`+
      (it.options ? `<p>${it.options.map(o=>(it.selected.includes(o)?"☒ ":"☐ ")+esc(o)).join(" &nbsp;&nbsp; ")}</p>`
                  : `<p>${esc(it.value||"—").replace(/\n/g,"<br>")}</p>`)).join("");
    else inner = tbl(sec);
    return `<section><h2>${sec.n}. ${esc(sec.title)}</h2>${inner}</section>`;
  }).join("");
  const html = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title>
<style>body{font-family:Cairo,Arial,sans-serif;max-width:860px;margin:24px auto;padding:0 16px;color:#10321f;line-height:1.8;text-align:right}
h1{text-align:center;color:#0f4d33;margin:8px 0 4px}.sub{text-align:center;color:#666;margin:0 0 6px}.meta{text-align:center;color:#888;font-size:13px;border-bottom:3px solid #c9971f;padding-bottom:10px;margin-bottom:18px}
h2{background:#0f4d33;color:#fff;padding:8px 14px;border-radius:8px;font-size:18px;margin:26px 0 10px}
h3{color:#9c760f;font-size:15px;margin:14px 0 2px}p{margin:0 18px 6px 0}
table{width:100%;border-collapse:collapse;margin:8px 0}th{background:#0f4d33;color:#fff;padding:8px;border:1px solid #b8b2a0}td{border:1px solid #b8b2a0;padding:8px;vertical-align:middle}td.lbl{background:#f3ebd3;font-weight:bold;color:#0f4d33}
footer{margin-top:30px;border-top:3px solid #c9971f;padding-top:12px;text-align:center;font-size:13px}footer img{height:50px;vertical-align:middle}</style></head><body>
<h1>${esc(title)}</h1><p class="sub">${esc(M.desc)}</p><div class="meta">نموذج رقم ${formId} | تاريخ التصدير: ${nowAr()}</div>
${secs}<footer><img src="${DIWAN_LOGO}" alt=""> <b>${esc(DIWAN_NAME)}</b><br><a href="${DIWAN_FB_URL}">${DIWAN_FB_URL}</a></footer></body></html>`;
  return new Blob([html],{type:"text/html;charset=utf-8"});
}

/* ================= JSON ================= */
function buildJsonBlob(formId, docName){
  const obj = {formId, formTitle:FORMS[formId].title, documentName:docName, exportedAt:new Date().toISOString(), data:collectFormData(formId)};
  return new Blob([JSON.stringify(obj,null,2)],{type:"application/json;charset=utf-8"});
}

async function buildBlob(fmt, formId, docName){
  if(fmt==="docx") return buildDocxSafe(formId, docName);
  if(fmt==="pdf")  return buildPdfBlob();
  if(fmt==="html") return buildHtmlBlob(formId, docName);
  return buildJsonBlob(formId, docName);
}

/* ================= الزر القديم "Word" يستخدم المحرك الجديد ================= */
window.exportWord = async function(formId){
  const {pct} = computeCompletion(formId);
  if(pct < 40 && !confirm(`الوثيقة مكتملة بنسبة ${pct}% فقط. هل تريد المتابعة بالتصدير رغم ذلك؟`)) return;
  try{
    const blob = await buildDocxSafe(formId, "");
    downloadBlob(blob, `نموذج_${formId}_${FORMS[formId].title}.docx`);
    toast("تم تصدير الملف بصيغة Word بنجاح 📝");
  }catch(e){ console.error(e); toast("حدث خطأ أثناء تصدير Word: "+(e&&e.message||e), true); }
};

/* ================= نافذة الحفظ: اسم الوثيقة + اسم الملف + الصيغة + مكان الحفظ ================= */
let nameTouched = false;
function ensureSaveDialog(){
  if(document.getElementById("svOverlay")) return;
  const d = document.createElement("div");
  d.id="svOverlay"; d.className="no-print";
  d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:16px";
  d.innerHTML = `
  <div dir="rtl" style="background:#fff;border-radius:16px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden">
    <div class="brand-grad" style="color:#fff;padding:14px 18px;font-weight:800;font-size:15px">📥 حفظ الوثيقة على جهازك</div>
    <div style="padding:18px">
      <label style="display:block;font-size:12.5px;font-weight:700;color:#555;margin-bottom:4px">اسم الوثيقة (يظهر كعنوان داخل الملف)</label>
      <input id="svDocName" class="field-input" style="margin-bottom:12px">
      <label style="display:block;font-size:12.5px;font-weight:700;color:#555;margin-bottom:4px">اسم الملف</label>
      <input id="svFileName" class="field-input" style="margin-bottom:12px">
      <label style="display:block;font-size:12.5px;font-weight:700;color:#555;margin-bottom:4px">صيغة الحفظ</label>
      <select id="svFormat" class="field-input" style="margin-bottom:10px">
        ${Object.entries(FORMATS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join("")}
      </select>
      <div id="svHint" style="font-size:11.5px;color:#777;line-height:1.7;margin-bottom:14px"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="svGo" type="button" class="gold-grad" style="color:#0a331f;font-weight:800;font-size:13px;padding:9px 16px;border-radius:10px;flex:1">📂 اختيار مكان الحفظ وحفظ</button>
        <button id="svCancel" type="button" style="background:#eee;color:#444;font-weight:700;font-size:13px;padding:9px 16px;border-radius:10px">إلغاء</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(d);
  d.addEventListener("click",e=>{ if(e.target===d) closeSaveDialog(); });
  document.getElementById("svCancel").onclick = closeSaveDialog;
  document.getElementById("svGo").onclick = doSave;
  document.getElementById("svFileName").addEventListener("input",()=>{ nameTouched=true; });
  document.getElementById("svDocName").addEventListener("input",e=>{
    if(!nameTouched) document.getElementById("svFileName").value = cleanName(e.target.value);
  });
}
window.openSaveDialog = function(){
  const id = STATE.view; if(!FORMS[id]) return;
  ensureSaveDialog(); nameTouched=false;
  const base = `نموذج ${id}: ${FORMS[id].title}`;
  document.getElementById("svDocName").value = base;
  document.getElementById("svFileName").value = cleanName(base);
  document.getElementById("svHint").textContent = window.showSaveFilePicker
    ? "ستظهر لك نافذة النظام لاختيار المجلد وتأكيد اسم الملف."
    : "متصفحك لا يدعم اختيار المجلد مباشرة؛ سيُنزَّل الملف إلى مجلد التنزيلات (فعّل خيار «السؤال عن مكان الحفظ» في إعدادات المتصفح لاختيار المجلد). يُنصح باستخدام Chrome أو Edge.";
  document.getElementById("svOverlay").style.display="flex";
  setTimeout(()=>document.getElementById("svFileName").focus(),50);
};
function closeSaveDialog(){ const o=document.getElementById("svOverlay"); if(o) o.style.display="none"; }

async function doSave(){
  const formId = STATE.view; if(!FORMS[formId]) return;
  const docName = document.getElementById("svDocName").value.trim();
  const fmtKey = document.getElementById("svFormat").value;
  const fmt = FORMATS[fmtKey];
  let name = cleanName(document.getElementById("svFileName").value) || "وثيقة";
  name = name.replace(new RegExp("\\."+fmt.ext+"$","i"),"");
  const full = name+"."+fmt.ext;
  const btn = document.getElementById("svGo"); const old = btn.innerHTML;

  btn.innerHTML = "⏳ جارِ التجهيز..."; btn.disabled = true;
  try{
    const blob = await buildBlob(fmtKey, formId, docName);
    let saved = false;
    if(window.showSaveFilePicker){
      try{
        const handle = await window.showSaveFilePicker({suggestedName:full, types:[{description:fmt.label, accept:{[fmt.mime]:["."+fmt.ext]}}]});
        const w = await handle.createWritable(); await w.write(blob); await w.close();
        saved = true; toast("تم حفظ الملف في المكان الذي اخترته ✅");
      }catch(e){
        if(e && e.name==="AbortError"){ return; }
        console.warn("picker unavailable, falling back to download", e);
      }
    }
    if(!saved){ downloadBlob(blob, full); toast("تم تنزيل الملف: "+full); }
    closeSaveDialog();
  }catch(e){ console.error(e); toast("تعذّر حفظ الملف: "+(e&&e.message||e), true); }
  finally{ btn.innerHTML = old; btn.disabled = false; }
}

/* ================= حقن زر الحفظ في شريط الأدوات بعد كل رسم للواجهة ================= */
const _renderApp = renderApp;
renderApp = function(){
  _renderApp();
  try{
    if(FORMS[STATE.view]){
      const pdfBtn = document.getElementById("pdfBtn");
      if(pdfBtn && !document.getElementById("saveAsBtn")){
        const b = document.createElement("button");
        b.id="saveAsBtn"; b.type="button"; b.onclick = openSaveDialog;
        b.className="gold-grad text-[#0a331f] text-[12.5px] font-extrabold px-3.5 py-2 rounded-lg shadow-sm";
        b.textContent = "📥 حفظ باسم…";
        b.title = "اختيار مكان الحفظ واسم الملف والصيغة";
        pdfBtn.parentNode.insertBefore(b, pdfBtn);
      }
    }
  }catch(e){}
  updateScrollArrows();
};

/* ================= أسهم الصعود والنزول ================= */
function ensureScrollArrows(){
  if(document.getElementById("scrollNav")) return;
  const st = document.createElement("style");
  st.textContent = `#scrollNav{position:fixed;left:14px;bottom:84px;z-index:45;display:flex;flex-direction:column;gap:8px}
  #scrollNav button{width:44px;height:44px;border-radius:999px;background:var(--forest);color:#fff;border:2px solid var(--gold);font-size:18px;line-height:1;box-shadow:0 6px 16px rgba(0,0,0,.28);cursor:pointer;transition:.2s}
  #scrollNav button:hover{background:var(--gold);color:#0a331f;transform:scale(1.08)}
  #scrollNav button.off{opacity:.3;pointer-events:none}`;
  document.head.appendChild(st);
  const nav = document.createElement("div"); nav.id="scrollNav"; nav.className="no-print";
  nav.innerHTML = `<button id="goTop" type="button" title="الصعود إلى أعلى الصفحة" aria-label="أعلى الصفحة">▲</button>
                   <button id="goBottom" type="button" title="النزول إلى أسفل الصفحة" aria-label="أسفل الصفحة">▼</button>`;
  document.body.appendChild(nav);
  document.getElementById("goTop").onclick = ()=>window.scrollTo({top:0,behavior:"smooth"});
  document.getElementById("goBottom").onclick = ()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"});
  window.addEventListener("scroll", updateScrollArrows, {passive:true});
  window.addEventListener("resize", updateScrollArrows);
}
function updateScrollArrows(){
  const t = document.getElementById("goTop"), b = document.getElementById("goBottom"); if(!t||!b) return;
  const y = window.scrollY||document.documentElement.scrollTop;
  const max = document.documentElement.scrollHeight - window.innerHeight;
  t.classList.toggle("off", y < 120);
  b.classList.toggle("off", max - y < 120);
}

ensureScrollArrows();
renderApp();
})();
