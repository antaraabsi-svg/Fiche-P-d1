<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root{
    --forest:#0f4d33; --forest-dark:#0a331f; --forest-light:#166740;
    --gold:#c9971f; --gold-light:#e0b23c; --gold-dark:#9c760f;
    --navy:#1c3a5c; --navy-dark:#122843;
    --orange:#d9822b; --orange-dark:#b8661a;
    --cream:#faf8f2;
    --rail:76px; --panel:280px;
  }
  *{font-family:'Cairo','Tajawal',sans-serif;}
  body{background:var(--cream);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#c9971f55;border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  .brand-grad{background:linear-gradient(135deg,var(--forest) 0%, var(--forest-dark) 100%);}
  .gold-grad{background:linear-gradient(135deg,var(--gold-light) 0%, var(--gold) 60%, var(--gold-dark) 100%);}
  .tone-navy{background:var(--navy);}
  .tone-green{background:var(--forest);}
  .tone-orange{background:var(--orange);}
  .field-input{border:1.5px solid #d8d2c2;border-radius:8px;padding:8px 12px;width:100%;font-size:14px;background:#fff;transition:.15s;}
  .field-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px #c9971f22;}
  .card-hover{transition:.2s;}
  .card-hover:hover{transform:translateY(-3px);box-shadow:0 12px 28px -8px rgba(15,77,51,.28);}
  .mentor-btn{width:22px;height:22px;border-radius:999px;background:#0f4d3312;color:var(--forest);display:inline-flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;border:1px solid #0f4d3330;flex-shrink:0;transition:.15s;}
  .mentor-btn:hover{background:var(--forest);color:#fff;transform:scale(1.08);}
  .zap-btn{width:22px;height:22px;border-radius:999px;background:#c9971f18;color:var(--gold-dark);display:inline-flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:1px solid #c9971f40;flex-shrink:0;transition:.15s;}
  .zap-btn:hover{background:var(--gold);color:#fff;transform:scale(1.08);}
  .zap-btn:disabled{opacity:.5;cursor:wait;}
  .drawer{transition:transform .35s cubic-bezier(.22,1,.36,1);}
  .fade-in{animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .spin{animation:spin 1s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .skeleton{background:linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

  /* ===== Sidebar: rail (collapsed, icons only) <-> panel (expanded) ===== */
  #sidebar{
    width:var(--rail);
    transition:width .28s cubic-bezier(.22,1,.36,1), transform .28s cubic-bezier(.22,1,.36,1);
  }
  #sidebar.expanded{ width:var(--panel); }
  @media (min-width:1024px){
    #sidebar{ position:sticky; top:0; height:100vh; transform:none !important; }
    #sidebar:hover{ width:var(--panel); }
    #sidebar:hover .sb-text{ opacity:1; }
    #sidebar .sb-text{ opacity:0; transition:opacity .18s ease .05s; white-space:nowrap; }
    #sidebar:hover .sb-text{ transition-delay:.08s; }
  }
  @media (max-width:1023px){
    #sidebar{ position:fixed; inset-inline-end:0; top:0; height:100vh; width:var(--panel); z-index:50; transform:translateX(100%); }
    #sidebar.mobile-open{ transform:translateX(0); }
    #sidebar .sb-text{ opacity:1; }
  }
  .sb-scrollarea{ scrollbar-width:thin; }

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;inset:0;width:100%;}
    .no-print{display:none!important;}
  }
</style>

<body class="text-gray-800">

function setArchive(arr){ try{ localStorage.setItem('jeunesse_archive', JSON.stringify(arr)); }catch(e){} }

function collectFormData(formId){
  const s = FORMS[formId]; const values={}, checks={}, tables={};
  s.sections.forEach(sec=>{
    if(sec.type==="table"){
      const hasIndex = sec.indexCol !== false; const dataCols = hasIndex ? sec.cols.slice(1) : sec.cols;
      const rows = [];
      for(let r=0;r<sec.rows;r++){
        rows.push(dataCols.map((c,ci)=>{
          const el = document.querySelector(`input[data-table="s${sec.n}"][data-row="${r}"][data-col="${ci}"]`);
          return (el && !el.readOnly) ? el.value : "";
        }));
      }
      tables[`s${sec.n}`] = rows;
    } else if(sec.type==="approval"){
      const rows = sec.cols.map((c,ci)=>[0,1,2,3].map(fi=>document.querySelector(`input[data-table="s${sec.n}"][data-row="${ci}"][data-col="${fi}"]`)?.value || ""));
      tables[`s${sec.n}`] = rows;
    } else {
      sec.fields.forEach((f,idx)=>{
        const id = `s${sec.n}_f${idx}`;
        if(f.type==="checks") checks[id] = Array.from(document.querySelectorAll(`input[data-id="${id}"]:checked`)).map(x=>x.dataset.opt);
        else values[id] = fid(id)?.value || "";
      });
    }
  });
  return {values, checks, tables};
}

function persistCurrentForm(formId){
  const data = collectFormData(formId);
  if(STATE.editingArchiveId){
    let arr = getArchive(); const idx = arr.findIndex(e=>e.id===STATE.editingArchiveId);
    if(idx>-1){ arr[idx].data = data; arr[idx].savedAt = Date.now(); setArchive(arr); }
  } else {
    try{ localStorage.setItem('draft_'+formId, JSON.stringify(data)); }catch(e){}
  }
  updateSavedIndicator();
  updateProgressBar(formId);
}

function attachAutoSave(formId){
  const area = fid("printArea"); if(!area) return;
  const handler = ()=>{ clearTimeout(autoSaveTimer); autoSaveTimer = setTimeout(()=>persistCurrentForm(formId), 700); };
  area.addEventListener("input", handler);
  area.addEventListener("change", handler);
}

function updateSavedIndicator(){
  const el = fid("savedIndicator"); if(!el) return;
  const now = new Date(); const hh = String(now.getHours()).padStart(2,"0"), mm = String(now.getMinutes()).padStart(2,"0");
  el.textContent = `💾 آخر حفظ ${hh}:${mm}`; el.classList.remove("opacity-0");
}

function saveToArchive(formId){
  const data = collectFormData(formId);
  let arr = getArchive();
  if(STATE.editingArchiveId){
    const idx = arr.findIndex(e=>e.id===STATE.editingArchiveId);
    if(idx>-1){ arr[idx].data=data; arr[idx].savedAt=Date.now(); setArchive(arr); toast("تم تحديث الوثيقة المحفوظة 💾"); updateSavedIndicator(); return; }
  }
  const id = "a_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
  arr.unshift({id, formId, title:FORMS[formId].title, savedAt:Date.now(), data});
  setArchive(arr);
  STATE.editingArchiveId = id;
  try{ localStorage.removeItem("draft_"+formId); }catch(e){}
  toast("تم حفظ الوثيقة في الأرشيف 💾");
  renderApp(); afterFormRender(formId);
}

function newDocumentForm(formId){
  STATE.editingArchiveId = null;
  try{ localStorage.removeItem("draft_"+formId); }catch(e){}
  renderApp(); afterFormRender(formId);
  toast("بدأت وثيقة جديدة فارغة 🗒️");
}

function openArchiveEntry(id){
  const entry = getArchive().find(e=>e.id===id); if(!entry) return;
  STATE.view = entry.formId; STATE.mobileSidebarOpen = false; STATE.editingArchiveId = id;
  renderApp();
  applyDocumentValues(entry.data);
  afterFormRender(entry.formId, true);
}

function deleteArchiveEntry(id){
  if(!confirm("هل تريد حذف هذه الوثيقة نهائياً من الأرشيف؟")) return;
  setArchive(getArchive().filter(e=>e.id!==id));
  if(STATE.editingArchiveId===id) STATE.editingArchiveId = null;
  toast("تم حذف الوثيقة من الأرشيف", true);
  renderApp();
}

function goToArchive(){ STATE.view = "archive"; STATE.mobileSidebarOpen = false; STATE.editingArchiveId = null; renderApp(); }

/* ===================================================================== التحقق ونسبة الاكتمال ===================================================================== */
function computeCompletion(formId){
  const s = FORMS[formId]; if(!s) return {filled:0,total:0,pct:0};
  let total=0, filled=0;
  s.sections.forEach(sec=>{
    if(sec.type==="table"||sec.type==="approval") return;
    sec.fields.forEach((f,idx)=>{
      total++;
      const id = `s${sec.n}_f${idx}`;
      if(f.type==="checks"){ if(document.querySelectorAll(`input[data-id="${id}"]:checked`).length) filled++; }
      else { if(fid(id) && fid(id).value.trim()) filled++; }
    });
  });
  return {filled, total, pct: total ? Math.round(filled/total*100) : 0};
}
function updateProgressBar(formId){
  const {pct} = computeCompletion(formId);
  const bar = fid("progressBarFill"), txt = fid("progressBarText");
  if(bar){ bar.style.width = pct+"%"; bar.style.background = pct<40?"#c2410c":pct<80?"#c9971f":"#0f4d33"; }
  if(txt){ txt.textContent = pct+"% مكتمل"; }
}

function attachDateValidation(formId){
  const s = FORMS[formId]; if(!s) return;
  s.sections.forEach(sec=>{
    if(sec.type==="table"||sec.type==="approval") return;
    const dateFields = sec.fields.map((f,idx)=>({f,idx})).filter(x=>x.f.type==="date");
    for(let i=0;i<dateFields.length-1;i++){
      const a=dateFields[i], b=dateFields[i+1];
      if(/من|بداية|انطلاق/.test(a.f.label) && /إلى|نهاية/.test(b.f.label)){
        const idA=`s${sec.n}_f${a.idx}`, idB=`s${sec.n}_f${b.idx}`;
        const elA=fid(idA), elB=fid(idB); if(!elA||!elB) continue;
        const check=()=>{
          let warn = fid("warn_"+idB);
          if(elA.value && elB.value && elA.value > elB.value){
            if(!warn){ warn=document.createElement("div"); warn.id="warn_"+idB; warn.className="text-[11px] text-red-600 font-bold mt-1"; elB.insertAdjacentElement("afterend", warn); }
            warn.textContent = "⚠️ يجب أن يكون هذا التاريخ بعد تاريخ البداية";
          } else if(warn){ warn.remove(); }
        };
        elA.addEventListener("change", check); elB.addEventListener("change", check);
      }
    }
  });
}

function afterFormRender(formId, skipDraftLoad){
  if(!FORMS[formId]) return;
  if(!skipDraftLoad && !STATE.editingArchiveId){
    const draftRaw = localStorage.getItem("draft_"+formId);
    if(draftRaw){ try{ applyDocumentValues(JSON.parse(draftRaw)); }catch(e){} }
  }
  attachAutoSave(formId);
  attachDateValidation(formId);
  updateProgressBar(formId);
  updateSavedIndicator();
}

/* ===================================================================== FIELD / SECTION RENDERERS ===================================================================== */
function fieldRow(sec, f, idx, formTitle, formId){
  const id = `s${sec.n}_f${idx}`;
  const mentorBtn = `<button class="mentor-btn" onclick='openMentor(${JSON.stringify(f.label)}, ${JSON.stringify(formTitle)})' title="مساعد ذكي">؟</button>`;
  const zapBtn = `<button class="zap-btn" data-zap="${id}" onclick='fillSingleField("${formId}", ${sec.n}, ${idx})' title="توليد هذا الحقل فقط">⚡</button>`;
  if(f.type==="checks"){
    return `<div class="mb-3" data-field="${id}">
      <div class="flex items-center gap-2 mb-1.5"><label class="text-[12.5px] font-bold text-gray-600">${f.label}</label>${mentorBtn}${zapBtn}</div>
      <div class="flex flex-wrap gap-2">
        ${f.options.map(o=>`<label class="flex items-center gap-1.5 text-[12.5px] bg-gray-50 border border-gray-200 rounded-lg px-2.5 py-1.5 cursor-pointer">
          <input type="checkbox" data-id="${id}" data-opt="${o}" class="accent-[var(--forest)]"> ${o}</label>`).join("")}
      </div>
    </div>`;
  }
  if(f.type==="textarea"){
    return `<div class="mb-3" data-field="${id}">
      <div class="flex items-center gap-2 mb-1.5"><label class="text-[12.5px] font-bold text-gray-600">${f.label}</label>${mentorBtn}${zapBtn}</div>
      <textarea id="${id}" rows="3" class="field-input"></textarea>
    </div>`;
  }
  return `<div class="mb-3" data-field="${id}">
    <div class="flex items-center gap-2 mb-1.5"><label class="text-[12.5px] font-bold text-gray-600">${f.label}</label>${mentorBtn}${zapBtn}</div>
    <input id="${id}" type="${f.type==='date'?'date':'text'}" class="field-input">
  </div>`;
}

function sectionHeader(sec){
  return `<div class="flex items-center gap-2 text-white px-4 py-2.5 rounded-lg mb-4 tone-${sec.tone}">
    <span class="text-[15px]">${sec.icon||'📌'}</span><span class="font-extrabold text-[13.5px]">${sec.n}. ${sec.title}</span>
  </div>`;
}

function renderTableSection(sec){
  const hasIndex = sec.indexCol !== false;
  const dataCols = hasIndex ? sec.cols.slice(1) : sec.cols;
  const rows = Array.from({length:sec.rows}).map((_,ri)=>{
    const preset = sec.presets ? sec.presets[ri] : null;
    const idxCell = hasIndex ? `<td class="border border-gray-200 text-center text-[12px] font-bold text-gray-500 w-10">${ri+1}</td>` : "";
    const cells = dataCols.map((c,ci)=>{
      const presetVal = preset ? preset[ci] : null;
      if(presetVal){
        return `<td class="border border-gray-200 p-0"><input data-table="s${sec.n}" data-row="${ri}" data-col="${ci}" value="${presetVal}" readonly class="w-full h-full px-2 py-1.5 text-[12.5px] bg-gray-50 font-bold text-[var(--forest-dark)] outline-none"/></td>`;
      }
      return `<td class="border border-gray-200 p-0"><input data-table="s${sec.n}" data-row="${ri}" data-col="${ci}" class="w-full h-full px-2 py-1.5 text-[12.5px] outline-none"/></td>`;
    }).join("");
    return `<tr>${idxCell}${cells}</tr>`;
  }).join("");
  return `<div class="bg-white rounded-xl border border-black/5 p-4 mb-5">
    ${sectionHeader(sec)}
    <div class="overflow-x-auto"><table class="w-full border-collapse text-[12.5px]">
      <thead><tr>${sec.cols.map(c=>`<th class="border border-gray-200 bg-gray-50 py-2 font-bold text-gray-600 text-[12px] px-1.5">${c}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function renderApprovalSection(sec){
  const fieldsPerCol = ["الاسم","الصفة","التاريخ","التوقيع"];
  const gridCls = sec.cols.length===1?"grid-cols-1 max-w-sm":sec.cols.length===2?"sm:grid-cols-2":sec.cols.length===3?"sm:grid-cols-3":"sm:grid-cols-2 lg:grid-cols-4";
  return `<div class="bg-white rounded-xl border border-black/5 p-4 mb-5">
    ${sectionHeader(sec)}
    <div class="grid grid-cols-1 ${gridCls} gap-4">
      ${sec.cols.map((c,ci)=>`
        <div class="border border-gray-200 rounded-lg p-3">
          <div class="text-[12.5px] font-extrabold text-[var(--forest-dark)] mb-2 text-center">${c}</div>
          ${fieldsPerCol.map((fl,fi)=>`
            <div class="flex items-center gap-2 mb-1.5 text-[12px]">
              <span class="text-gray-500 w-14 flex-shrink-0">${fl} :</span>
              <input data-table="s${sec.n}" data-row="${ci}" data-col="${fi}" class="field-input !py-1 !text-[12px]" />
            </div>`).join("")}
        </div>`).join("")}
    </div>
  </div>`;
}

/* ===================================================================== AI CORE: طلب JSON قوي مع استخراج احتياطي ===================================================================== */
async function callClaudeJSON(prompt, maxTokens){
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:maxTokens||600, messages:[{role:"user", content:prompt}]})
  });
  if(!resp.ok) throw new Error("HTTP "+resp.status);
  const data = await resp.json();
  const text = (data.content||[]).map(b=>b.text||"").join("");
  return extractJSON(text);
}
function extractJSON(text){
  let clean = text.replace(/```json/gi,"").replace(/```/g,"").trim();
  try{ return JSON.parse(clean); }catch(e){}
  const start = clean.indexOf("{"); const end = clean.lastIndexOf("}");
  if(start!==-1 && end!==-1 && end>start){
    try{ return JSON.parse(clean.slice(start,end+1)); }catch(e){}
  }
  throw new Error("JSON parse failed");
}

/* ===================================================================== مولّد احتياطي محلي (يعمل بدون اتصال) ===================================================================== */
const NAME_POOL = ["أمين بلقاسم","ياسمين حمدي","سارة بن عمر","إلياس معمري","نور الهدى شريف","عبد الرحمن زروقي","خديجة بوزيد","محمد أمين قاسمي"];
const PLACE_POOL = ["دار الشباب - وسط المدينة","المركب الرياضي الجواري","قاعة المحاضرات - ديوان الشباب","الفضاء الشبابي متعدد الأنشطة"];
const TOPIC_POOL = ["نشاط توعوي حول الذكاء الاصطناعي والاستخدام الآمن للتكنولوجيا","ورشة حول المواطنة الرقمية وأخلاقيات الإنترنت","مخيم قيادة شبابية وتنمية المهارات الحياتية","حملة تحسيسية حول حماية البيئة والتنمية المستدامة"];
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function todayPlus(days){ const d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }

function fallbackFieldValue(label, type, options){
  const l = label;
  if(type==="checks") return options.slice(0, Math.min(2,options.length));
  if(type==="date") return todayPlus(Math.floor(Math.random()*20));
  if(/اسم.*مؤسس|مؤسسة/.test(l)) return "دار الشباب — بلدية الجزائر الوسطى";
  if(/الولاية/.test(l)) return "الجزائر";
  if(/البلدية/.test(l)) return "الجزائر الوسطى";
  if(/اسم.*لقب|الاسم/.test(l)) return pick(NAME_POOL);
  if(/مكان|عنوان/.test(l)) return pick(PLACE_POOL);
  if(/هاتف/.test(l)) return "0555 12 34 56";
  if(/بريد/.test(l)) return "contact@jeunesse.dz";
  if(/عدد|نسبة|%/.test(l)) return String(20+Math.floor(Math.random()*80));
  if(/اسم النشاط|اسم المشروع|اسم المبادرة|اسم البرنامج|عنوان/.test(l)) return pick(TOPIC_POOL);
  if(/مدة/.test(l)) return "3 أيام";
  if(type==="textarea") return `عناصر أساسية متعلقة بـ${l} تمت صياغتها بشكل واقعي ومهني ضمن سياق ${pick(TOPIC_POOL)}.`;
  return `بيانات نموذجية لحقل ${l}`;
}

/* ===================================================================== AI FILL: حقل واحد فقط ===================================================================== */
async function fillSingleField(formId, sectionN, fieldIdx){
  const s = FORMS[formId];
  const sec = s.sections.find(x=>x.n===sectionN);
  const f = sec.fields[fieldIdx];
  const fieldId = `s${sectionN}_f${fieldIdx}`;
  const btn = document.querySelector(`[data-zap="${fieldId}"]`);
  const original = btn.innerHTML; btn.innerHTML = `<span class="spin">⏳</span>`; btn.disabled = true;

  try{
    let value;
    if(f.type==="checks"){
      const prompt = `في سياق نموذج "${s.title}" (قطاع الشباب والرياضة بالجزائر)، اختر الخيار أو الخيارين الأنسب لحقل "${f.label}" من بين: ${f.options.join("، ")}.
أعد فقط JSON بالشكل: {"selected": ["خيار1","خيار2"]} بدون أي نص إضافي.`;
      const parsed = await callClaudeJSON(prompt, 200);
      value = parsed.selected || fallbackFieldValue(f.label,"checks",f.options);
      document.querySelectorAll(`input[data-id="${fieldId}"]`).forEach(cb=>{ cb.checked = value.includes(cb.dataset.opt); });
    } else {
      const prompt = `في سياق نموذج "${s.title}" (قطاع الشباب والرياضة بالجزائر)، اقترح قيمة واقعية واحترافية لحقل "${f.label}"${f.type==='date'?' (بصيغة YYYY-MM-DD)':''}.
أعد فقط JSON بالشكل: {"value": "..."} بدون أي نص إضافي، وبدون نقاط تعداد.`;
      const parsed = await callClaudeJSON(prompt, 250);
      value = parsed.value || fallbackFieldValue(f.label, f.type, []);
      fid(fieldId).value = value;
    }
    toast("تم توليد الحقل ✨");
  }catch(e){
    if(f.type==="checks"){
      const opts = fallbackFieldValue(f.label,"checks",f.options);
      document.querySelectorAll(`input[data-id="${fieldId}"]`).forEach(cb=>{ cb.checked = opts.includes(cb.dataset.opt); });
    } else {
      fid(fieldId).value = fallbackFieldValue(f.label, f.type, []);
    }
    toast("تم التوليد محلياً (تعذّر الاتصال بالخدمة)", true);
  }finally{
    btn.innerHTML = original; btn.disabled = false;
  }
}

/* ===================================================================== AI FILL: الوثيقة كاملة (مع نسخة احتياطية محلية) ===================================================================== */
async function autoFillDocument(formId){
  const s = FORMS[formId];
  const btn = fid("autofillBtn"); const original = btn.innerHTML;
  btn.innerHTML = `<span class="spin">⏳</span> جارِ التوليد...`; btn.disabled = true;

  const plainFields = []; const checkFields = []; const tableSections = [];
  s.sections.forEach(sec=>{
    if(sec.type==="table"){ tableSections.push(sec); return; }
    if(sec.type==="approval") return;
    sec.fields.forEach((f,idx)=>{
      const id = `s${sec.n}_f${idx}`;
      if(f.type==="checks") checkFields.push({id,label:f.label,options:f.options});
      else plainFields.push({id,label:f.label,type:f.type});
    });
  });

  let usedFallback = false;
  try{
    const schemaDesc = {
      fields: plainFields.map(f=>({id:f.id,label:f.label,type:f.type})),
      checks: checkFields.map(f=>({id:f.id,label:f.label,options:f.options})),
      tables: tableSections.map(t=>({id:`s${t.n}`,title:t.title,cols:t.indexCol===false?t.cols:t.cols.slice(1),rows:Math.min(t.rows,4)})),
    };
    const prompt = `أنت خبير في إدارة الأنشطة والمشاريع الشبابية بالجزائر. اختر موضوعاً مهنياً واقعياً وعصرياً (مثل: نشاط توعوي حول الذكاء الاصطناعي، أو ورشة حول المواطنة الرقمية، أو مبادرة تطوعية بيئية) واملأ به نموذج "${s.title}" بالكامل ببيانات واقعية عالية الجودة ومتّسقة منطقياً مع بعضها.
مخطط الحقول (JSON):
${JSON.stringify(schemaDesc)}
أعد رداً بصيغة JSON فقط بدون أي نص إضافي وبدون علامات كود بالشكل التالي بالضبط:
{"values": {"<id الحقل>": "<القيمة النصية>", ...}, "checks": {"<id الحقل>": ["<خيار مختار من options>", ...]}, "tables": {"<id الجدول>": [["قيمة العمود1","قيمة العمود2", ...], ...]}}
التواريخ بصيغة YYYY-MM-DD. القيم يجب أن تكون نصوصاً عربية واقعية ومهنية ومحددة، بدون عبارات عامة أو نقاط.`;

    const parsed = await callClaudeJSON(prompt, 2000);
    applyDocumentValues(parsed, plainFields, checkFields, tableSections);
  }catch(e){
    usedFallback = true;
    const topic = pick(TOPIC_POOL);
    const values = {}; plainFields.forEach(f=>{ values[f.id] = fallbackFieldValue(f.label, f.type, []); });
    const checks = {}; checkFields.forEach(f=>{ checks[f.id] = fallbackFieldValue(f.label,"checks",f.options); });
    const tables = {}; tableSections.forEach(t=>{
      const hasIndex = t.indexCol!==false; const cols = hasIndex? t.cols.slice(1) : t.cols;
      const nRows = Math.min(t.rows,4);
      tables[`s${t.n}`] = Array.from({length:nRows}).map(()=> cols.map(c=> fallbackFieldValue(c,"text",[])) );
    });
    applyDocumentValues({values,checks,tables}, plainFields, checkFields, tableSections);
  }finally{
    btn.innerHTML = original; btn.disabled = false;
    toast(usedFallback ? "تم توليد بيانات محلياً (تعذّر الاتصال بالخدمة الذكية)" : "تم توليد بيانات ذكية وملء الوثيقة بنجاح ✨", usedFallback);
  }
}

function applyDocumentValues(parsed, plainFields, checkFields, tableSections){
  Object.entries(parsed.values||{}).forEach(([id,val])=>{ const el=fid(id); if(el) el.value = val; });
  Object.entries(parsed.checks||{}).forEach(([id,opts])=>{
    document.querySelectorAll(`input[data-id="${id}"]`).forEach(cb=>{ cb.checked = (opts||[]).includes(cb.dataset.opt); });
  });
  Object.entries(parsed.tables||{}).forEach(([tid,rows])=>{
    (rows||[]).forEach((row,ri)=>{
      row.forEach((val,ci)=>{
        const el = document.querySelector(`input[data-table="${tid}"][data-row="${ri}"][data-col="${ci}"]`);
        if(el && !el.readOnly) el.value = val;
      });
    });
  });
}

function toast(msg, isError){
  const t = document.createElement("div");
  t.className = `fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] px-5 py-3 rounded-xl text-[13px] font-bold shadow-2xl text-white max-w-[92vw] text-center ${isError?'bg-amber-600':'bg-[var(--forest)]'}`;
  t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3400);
}

/* ===================================================================== EXPORT: PDF + Word ===================================================================== */
async function exportPDF(formId){
  const {pct} = computeCompletion(formId);
  if(pct < 40 && !confirm(`الوثيقة مكتملة بنسبة ${pct}% فقط. هل تريد المتابعة بالتصدير رغم ذلك؟`)) return;
  const btn = fid("pdfBtn"); const original = btn.innerHTML; btn.innerHTML = "⏳ جارِ التجهيز...";
  try{
    const area = fid("printArea");
    const canvas = await html2canvas(area, {scale:2, backgroundColor:"#ffffff"});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p","mm","a4");
    const pageW=210, pageH=297, imgW=pageW, imgH = canvas.height*imgW/canvas.width;
    let heightLeft = imgH, position = 0;
    const imgData = canvas.toDataURL("image/jpeg",0.95);
    pdf.addImage(imgData,"JPEG",0,position,imgW,imgH); heightLeft -= pageH;
    while(heightLeft > 0){ position = heightLeft - imgH; pdf.addPage(); pdf.addImage(imgData,"JPEG",0,position,imgW,imgH); heightLeft -= pageH; }
    pdf.save(`نموذج_${formId}_${FORMS[formId].title}.pdf`);
    toast("تم تصدير الملف بصيغة PDF بنجاح 📄");
  }catch(e){ toast("حدث خطأ أثناء تصدير PDF", true); }
  finally{ btn.innerHTML = original; }
}

async function exportWord(formId){
  const {pct} = computeCompletion(formId);
  if(pct < 40 && !confirm(`الوثيقة مكتملة بنسبة ${pct}% فقط. هل تريد المتابعة بالتصدير رغم ذلك؟`)) return;
  try{
    const { Document, Packer, Paragraph, TextRun, AlignmentType } = docx;
    const s = FORMS[formId];
    const children = [
      new Paragraph({ alignment:AlignmentType.CENTER, bidirectional:true, children:[ new TextRun({text:`نموذج ${formId}: ${s.title}`, bold:true, size:36, rightToLeft:true})] }),
      new Paragraph({ alignment:AlignmentType.CENTER, bidirectional:true, children:[ new TextRun({text:s.desc, italics:true, size:22, color:"555555", rightToLeft:true})], spacing:{after:300} }),
    ];
    s.sections.forEach(sec=>{
      children.push(new Paragraph({ bidirectional:true, spacing:{before:250, after:120},
        children:[ new TextRun({text:`${sec.n}. ${sec.title}`, bold:true, size:26, color:"0F4D33", rightToLeft:true})]}));
      if(sec.type==="table"){
        const hasIndex = sec.indexCol !== false;
        const dataCols = hasIndex ? sec.cols.slice(1) : sec.cols;
        for(let r=0;r<sec.rows;r++){
          const vals = dataCols.map((c,ci)=>document.querySelector(`input[data-table="s${sec.n}"][data-row="${r}"][data-col="${ci}"]`)?.value || "");
          if(vals.every(v=>!v)) continue;
          children.push(new Paragraph({ bidirectional:true, children:[ new TextRun({text:`${r+1}) ${dataCols.map((c,i)=>`${c}: ${vals[i]||"—"}`).join(" | ")}`, size:20, rightToLeft:true})]}));
        }
      } else if(sec.type==="approval"){
        sec.cols.forEach((c,ci)=>{
          const name = document.querySelector(`input[data-table="s${sec.n}"][data-row="${ci}"][data-col="0"]`)?.value || "—";
          const role = document.querySelector(`input[data-table="s${sec.n}"][data-row="${ci}"][data-col="1"]`)?.value || "—";
          children.push(new Paragraph({ bidirectional:true, children:[ new TextRun({text:`${c} — الاسم: ${name} | الصفة: ${role}`, size:20, rightToLeft:true})]}));
        });
      } else {
        sec.fields.forEach((f,idx)=>{
          const id = `s${sec.n}_f${idx}`; let val = "—";
          if(f.type==="checks"){
            const checked = Array.from(document.querySelectorAll(`input[data-id="${id}"]:checked`)).map(x=>x.dataset.opt);
            val = checked.length? checked.join("، ") : "—";
          } else { val = fid(id)?.value || "—"; }
          children.push(new Paragraph({ bidirectional:true, spacing:{after:80},
            children:[ new TextRun({text:`${f.label}: `, bold:true, size:21, rightToLeft:true}), new TextRun({text:val, size:21, rightToLeft:true})]}));
        });
      }
    });
    const doc = new Document({ sections:[{ properties:{}, children }] });
    const blob = await Packer.toBlob(doc);
    saveAs(blob, `نموذج_${formId}_${s.title}.docx`);
    toast("تم تصدير الملف بصيغة Word بنجاح 📝");
  }catch(e){ toast("حدث خطأ أثناء تصدير Word", true); }
}
